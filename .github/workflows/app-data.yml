name: App data from Square

# Rebuilds prices.json (in-store price scanner) and data.json (offers + new arrivals) from Square.
# Runs every hour from about 9:15 am to 10:15 pm Melbourne time, plus 2:15 am. Needs the repository secret SQUARE_TOKEN.
# Only product, price and offer data - never customer or order data (the repo is public).
on:
  schedule:
    - cron: '15 0-11,15,22,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: app-data-push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app data from Square
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
        run: python build_app_data.py
      - name: Save changes
        run: |
          git config user.name "PGCC app bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json data.json
          git diff --cached --quiet && exit 0
          git commit -m "App data from Square"
          git pull --rebase
          git push
